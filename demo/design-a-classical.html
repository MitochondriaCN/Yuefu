<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案A · 古典乐章 · Classical Manuscript</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-ivory:  #FFFBF0;
  --bg-warm:   #F6F2E9;
  --gold:      #B68A4C;
  --gold-soft: rgba(182,138,76,0.32);
  --gold-faint:rgba(182,138,76,0.14);
  --brown:     #5D4037;
  --ink:       #3F2E1F;
  --ink-soft:  #8D7A6A;
  --border:    rgba(182,138,76,0.18);
  --serif:     'Noto Serif SC','Songti SC',serif;
  --sans:      'Noto Sans SC','PingFang SC',sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#E8DFCB 0%,#D9CFB8 100%);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}

/* ── Phone frame ── */
.phone {
  width:390px;
  min-height:844px;
  background:var(--bg-ivory);
  border-radius:44px;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.22),
    0 10px 24px rgba(0,0,0,0.10),
    inset 0 0 0 1px rgba(255,255,255,0.5);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}

/* Score-paper texture */
.phone::before {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='180' viewBox='0 0 280 180'><g stroke='%232B2A26' stroke-width='0.5' fill='none' opacity='0.9'><line x1='0' y1='30' x2='280' y2='30'/><line x1='0' y1='44' x2='280' y2='44'/><line x1='0' y1='58' x2='280' y2='58'/><line x1='0' y1='72' x2='280' y2='72'/><line x1='0' y1='86' x2='280' y2='86'/></g><g fill='%232B2A26' opacity='0.55'><circle cx='60' cy='65' r='3'/><circle cx='150' cy='51' r='3'/><circle cx='220' cy='79' r='3'/></g><g stroke='%232B2A26' stroke-width='0.5' fill='none' opacity='0.7'><line x1='60' y1='65' x2='60' y2='30'/><line x1='150' y1='51' x2='150' y2='25'/><line x1='220' y1='79' x2='220' y2='44'/></g></svg>");
  background-size:280px 180px;
  opacity:0.055;
  mix-blend-mode:multiply;
}

.phone > * { position:relative; z-index:1; }

/* ── Status bar ── */
.status-bar {
  height:32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  font-size:12px;
  font-weight:600;
  color:var(--ink);
}
.signal { display:inline-flex; gap:3px; align-items:flex-end; }
.signal .bar { display:inline-block; width:3px; background:var(--ink); border-radius:1px; }
.battery {
  display:inline-flex; align-items:center; gap:3px;
}
.battery-body {
  width:20px; height:10px;
  border:1.5px solid var(--ink);
  border-radius:2px;
  position:relative;
}
.battery-body::after {
  content:"";
  position:absolute; right:-3px; top:2px;
  width:2px; height:5px;
  background:var(--ink);
  border-radius:0 1px 1px 0;
}
.battery-body .fill {
  position:absolute; inset:1.5px; right:1.5px;
  background:var(--ink);
  border-radius:1px;
  width:70%;
}

/* ── Content ── */
.content {
  flex:1;
  overflow-y:auto;
  padding:0 20px 20px;
}

/* ── Hero ── */
.hero {
  padding:28px 0 12px;
  position:relative;
}
.hero::before {
  content:"";
  position:absolute;
  top:0; left:-20px; right:-20px; height:160px;
  background:radial-gradient(ellipse 60% 50% at 50% 20%, rgba(182,138,76,0.08), transparent 70%);
  pointer-events:none;
}
.hero-title {
  font-family:var(--serif);
  font-weight:900;
  font-size:36px;
  letter-spacing:0.15em;
  color:var(--ink);
  padding-left:0.15em;
  animation:breathe 6s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { opacity:0.92; }
  50%     { opacity:1; }
}
.hero-sub {
  margin-top:6px;
  font-family:var(--serif);
  font-size:14px;
  color:var(--ink-soft);
  letter-spacing:0.05em;
}

/* ── Scan CTA ── */
.scan-cta {
  margin-top:20px;
  position:relative;
  background:linear-gradient(135deg, #F6F2E9 0%, #E8D9BE 100%);
  border:1px solid rgba(182,138,76,0.4);
  border-radius:16px;
  padding:24px;
  display:flex;
  align-items:center;
  gap:16px;
  cursor:pointer;
  transition:transform 0.15s ease;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    inset 0 -1px 0 rgba(0,0,0,0.05),
    0 2px 8px rgba(62,46,31,0.08);
  overflow:hidden;
}
.scan-cta::before {
  content:"";
  position:absolute;
  top:0; left:0; right:0; height:40px;
  background:linear-gradient(to bottom, rgba(255,255,255,0.12), transparent);
  pointer-events:none;
}
.scan-cta:active { transform:scale(0.97); }
.scan-cta .icon-wrap {
  width:48px; height:48px;
  background:rgba(182,138,76,0.12);
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.scan-cta .icon-wrap svg { width:28px; height:28px; color:var(--gold); }
.scan-cta .text {
  font-family:var(--serif);
  font-weight:700;
  font-size:22px;
  color:var(--ink);
  letter-spacing:0.04em;
}
.scan-cta .text small {
  display:block;
  font-weight:400;
  font-size:13px;
  color:var(--ink-soft);
  margin-top:2px;
}

/* Bronze seal */
.seal {
  position:absolute;
  bottom:10px; right:14px;
  width:34px; height:34px;
  border:1.5px solid var(--gold);
  border-radius:4px;
  transform:rotate(-12deg);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif);
  font-weight:900;
  font-size:18px;
  color:var(--gold);
  opacity:0.55;
}

/* ── Section header ── */
.section-header {
  display:flex;
  align-items:center;
  gap:10px;
  margin:28px 0 14px;
  font-family:var(--serif);
  font-weight:700;
  font-size:13px;
  color:var(--gold);
  letter-spacing:0.3em;
}
.section-header::before {
  content:"";
  width:4px; height:14px;
  background:var(--gold);
  border-radius:1px;
}

/* ── File cards ── */
.file-card {
  background:var(--bg-ivory);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:10px;
  cursor:pointer;
  transition:background 0.2s ease, transform 0.15s ease;
  box-shadow:0 1px 3px rgba(62,46,31,0.06);
  opacity:0;
  animation:fadeInUp 0.5s ease forwards;
}
.file-card:nth-child(1) { animation-delay:0.1s; }
.file-card:nth-child(2) { animation-delay:0.2s; }
.file-card:nth-child(3) { animation-delay:0.3s; }
.file-card:nth-child(4) { animation-delay:0.4s; }

@keyframes fadeInUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

.file-card:hover { background:rgba(182,138,76,0.04); }
.file-card:active { transform:scale(0.98); }

.file-card .icon-area {
  width:44px; height:44px;
  background:rgba(182,138,76,0.10);
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.file-card .icon-area svg { width:22px; height:22px; color:var(--gold); }
.file-card .info { flex:1; min-width:0; }
.file-card .name {
  font-size:15px; font-weight:500; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.file-card .time {
  font-size:13px; color:var(--ink-soft);
  margin-top:2px;
}

/* Staff-line header decoration on each card */
.file-card::before {
  content:"";
  position:absolute;
  top:0; left:16px; right:16px;
  height:1px;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 3px,
    var(--gold-faint) 3px, var(--gold-faint) 3.5px
  );
  opacity:0.6;
  pointer-events:none;
}

/* ── Bottom nav ── */
.bottom-nav {
  height:83px;
  padding-bottom:23px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:var(--bg-ivory);
  border-top:1px solid var(--border);
}
.nav-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:500;
  color:var(--ink-soft);
  cursor:pointer;
  transition:color 0.2s;
}
.nav-item.active { color:var(--gold); }
.nav-item svg { width:24px; height:24px; }
</style>
</head>
<body>

<div class="phone">
  <!-- Status bar -->

    <div style="display:flex;align-items:center;gap:8px;">

      </div>

    <div class="file-card">
      <div class="icon-area">

      </div>
      <div class="info">
        <div class="name">月光奏鸣曲</div>

      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>主页</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      <span>乐谱</span>
    </div>

      <span>创作</span>
    </div>

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94c0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.04 7.04 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54a7.04 7.04 0 0 0-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a6.94 6.94 0 0 0-.07.94c0 .32.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54a7.04 7.04 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
