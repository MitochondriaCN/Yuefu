<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案C · 五线谱漫游 · Staff Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue-deep:  #1565C0;
  --blue-mid:   #1976D2;
  --blue-light: #E3F2FD;
  --gold:       #B68A4C;
  --surface:    #FFFFFF;
  --bg:         #F5F7FA;
  --ink:        #1A2332;
  --ink-soft:   #5A6B7F;
  --ink-muted:  #9EAAB8;
  --serif:      'Noto Serif SC','Songti SC',serif;
  --sans:       'Noto Sans SC','PingFang SC',sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#D5DCE6 0%,#C2CBD8 100%);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}

/* ── Phone frame ── */
.phone {
  width:390px;
  min-height:844px;
  background:var(--bg);
  border-radius:44px;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.20),
    0 10px 24px rgba(0,0,0,0.08),
    inset 0 0 0 1px rgba(255,255,255,0.5);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
.phone > * { position:relative; z-index:1; }

/* ── Status bar ── */
.status-bar {
  height:32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  font-size:12px;
  font-weight:600;
  color:var(--ink);
  background:var(--surface);
}
.signal { display:inline-flex; gap:3px; align-items:flex-end; }
.signal .bar { display:inline-block; width:3px; background:var(--ink); border-radius:1px; }
.battery-body {
  display:inline-block;
  width:20px; height:10px;
  border:1.5px solid var(--ink);
  border-radius:2px;
  position:relative;
}
.battery-body::after {
  content:"";
  position:absolute; right:-3px; top:2px;
  width:2px; height:5px;
  background:var(--ink);
  border-radius:0 1px 1px 0;
}
.battery-body .fill {
  position:absolute; inset:1.5px; right:1.5px;
  background:var(--ink);
  border-radius:1px;
  width:70%;
}

/* ── Content ── */
.content {
  flex:1;
  overflow-y:auto;
  padding:0 20px 20px;
}

/* ── Hero ── */
.hero {
  padding:24px 0 8px;
}
.hero-title {
  font-family:var(--serif);
  font-weight:900;
  font-size:32px;
  letter-spacing:0.12em;
  color:var(--ink);
  padding-left:0.12em;
}
.hero-sub {
  margin-top:4px;
  font-size:14px;
  color:var(--ink-soft);
}
.hero-stats {
  display:flex;
  gap:8px;
  margin-top:14px;
}
.stat-pill {
  padding:5px 12px;
  background:var(--blue-light);
  color:var(--blue-deep);
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

/* ── Scan CTA with falling notes ── */
.scan-cta {
  margin-top:20px;
  border-radius:20px;
  padding:28px 24px;
  background:linear-gradient(135deg, var(--blue-deep) 0%, var(--blue-mid) 100%);
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:transform 0.15s ease;
  box-shadow:0 4px 20px rgba(21,101,192,0.25);
}
.scan-cta:active { transform:scale(0.97); }

/* Falling music notes */
.falling-notes {
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.note {
  position:absolute;
  font-size:16px;
  color:rgba(255,255,255,0.12);
  animation:fall linear infinite;
  pointer-events:none;
}
@keyframes fall {
  from { transform:translateY(-30px) rotate(0deg); opacity:0.18; }
  to   { transform:translateY(calc(100% + 30px)) rotate(15deg); opacity:0.04; }
}

.scan-cta .content-inner {
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:16px;
}
.scan-cta .icon-wrap {
  width:48px; height:48px;
  background:rgba(255,255,255,0.15);
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.scan-cta .icon-wrap svg { width:28px; height:28px; color:#fff; }
.scan-cta .text {
  font-family:var(--serif);
  font-weight:700;
  font-size:22px;
  color:#fff;
  letter-spacing:0.04em;
}
.scan-cta .text small {
  display:block;
  font-weight:400;
  font-size:13px;
  color:rgba(255,255,255,0.65);
  margin-top:2px;
}
.scan-cta .arrow {
  margin-left:auto;
  color:rgba(255,255,255,0.5);
  font-size:22px;
}

/* ── Quick action: AI composition ── */
.quick-action {
  margin-top:14px;
  background:var(--surface);
  border-radius:16px;
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  border-left:3px solid var(--gold);
  box-shadow:0 1px 4px rgba(26,35,50,0.06);
  transition:transform 0.15s ease;
  animation:borderShimmer 3s ease-in-out infinite;
}
@keyframes borderShimmer {
  0%,100% { border-left-color:var(--gold); }
  50%     { border-left-color:rgba(182,138,76,0.5); }
}
.quick-action:active { transform:scale(0.98); }
.quick-action .qa-icon {
  width:40px; height:40px;
  background:rgba(182,138,76,0.10);
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.quick-action .qa-icon svg { width:22px; height:22px; color:var(--gold); }
.quick-action .info { flex:1; }
.quick-action .label { font-size:15px; font-weight:600; color:var(--ink); }
.quick-action .sub { font-size:12px; color:var(--ink-muted); margin-top:1px; }
.quick-action .arrow { color:var(--ink-muted); font-size:18px; }

/* ── Section header ── */
.section-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:24px 0 12px;
}
.section-header .title {
  font-size:15px; font-weight:600; color:var(--ink);
}
.section-header .link {
  font-size:13px; color:var(--blue-deep); font-weight:500;
  cursor:pointer;
}

/* ── Bento grid ── */
.bento-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.file-card {
  background:var(--surface);
  border-radius:14px;
  padding:14px 16px;
  cursor:pointer;
  transition:transform 0.15s ease, box-shadow 0.2s ease;
  box-shadow:0 1px 4px rgba(26,35,50,0.06);
  opacity:0;
  animation:fadeInUp 0.5s ease forwards;
}
.file-card:nth-child(1) { animation-delay:0.1s; }
.file-card:nth-child(2) { animation-delay:0.2s; }
.file-card:nth-child(3) { animation-delay:0.25s; }
.file-card:nth-child(4) { animation-delay:0.35s; }

@keyframes fadeInUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

.file-card:hover { box-shadow:0 4px 12px rgba(26,35,50,0.10); }
.file-card:active { transform:scale(0.98); }

/* Hero card spans full width */
.file-card.hero-card {
  grid-column:1 / -1;
  min-height:110px;
  border-left:3px solid var(--blue-deep);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.file-card .icon-row {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}
.file-card .icon-area {
  width:40px; height:40px;
  background:rgba(182,138,76,0.10);
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.file-card .icon-area svg { width:20px; height:20px; color:var(--gold); }
.file-card .icon-area.sm {
  width:36px; height:36px;
}
.file-card .icon-area.sm svg { width:18px; height:18px; }
.file-card .name {
  font-size:15px; font-weight:500; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.file-card.hero-card .name { font-size:17px; }
.file-card .meta {
  font-size:12px; color:var(--ink-muted);
  margin-top:2px;
}
.file-card .time {
  font-size:12px; color:var(--ink-muted);
}

/* ── Bottom nav ── */
.bottom-nav {
  height:83px;
  padding-bottom:23px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:var(--surface);
  box-shadow:0 -1px 4px rgba(0,0,0,0.04);
}
.nav-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:500;
  color:var(--ink-muted);
  cursor:pointer;
  transition:color 0.2s;
}
.nav-item.active { color:var(--blue-deep); }
.nav-item svg { width:24px; height:24px; }
</style>
</head>
