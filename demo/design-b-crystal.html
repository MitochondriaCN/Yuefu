<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案B · 晶莹流光 · Crystal Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --serif: 'Noto Serif SC','Songti SC',serif;
  --sans:  'Noto Sans SC','PingFang SC',sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#2A2040 0%,#1E1833 100%);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}

/* ── Phone frame ── */
.phone {
  width:390px;
  min-height:844px;
  border-radius:44px;
  box-shadow:
    0 40px 100px rgba(0,0,0,0.5),
    0 12px 30px rgba(0,0,0,0.3),
    inset 0 0 0 1px rgba(255,255,255,0.08);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  /* The gradient background */
  background:linear-gradient(160deg, #7B68C4 0%, #5266E8 40%, #3A4AC0 100%);
}

/* Animated radial light spots — "light through crystal" */
.phone::before,
.phone::after {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  border-radius:inherit;
}
.phone::before {
  background:radial-gradient(ellipse 40% 35% at 30% 25%, rgba(180,200,255,0.25), transparent 60%);
  animation:breathe1 8s ease-in-out infinite;
}
.phone::after {
  background:radial-gradient(ellipse 45% 40% at 70% 75%, rgba(160,140,220,0.20), transparent 60%);
  animation:breathe2 12s ease-in-out infinite 4s;
}
@keyframes breathe1 {
  0%,100% { opacity:0.85; transform:scale(1); }
  50%     { opacity:1;    transform:scale(1.08); }
}
@keyframes breathe2 {
  0%,100% { opacity:0.8; transform:scale(1.02); }
  50%     { opacity:1;   transform:scale(0.95); }
}

.phone > * { position:relative; z-index:1; }

/* ── Status bar ── */
.status-bar {
  height:32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  font-size:12px;
  font-weight:600;
  color:rgba(255,255,255,0.85);
}
.signal { display:inline-flex; gap:3px; align-items:flex-end; }
.signal .bar { display:inline-block; width:3px; background:rgba(255,255,255,0.85); border-radius:1px; }
.battery-body {
  display:inline-block;
  width:20px; height:10px;
  border:1.5px solid rgba(255,255,255,0.85);
  border-radius:2px;
  position:relative;
}
.battery-body::after {
  content:"";
  position:absolute; right:-3px; top:2px;
  width:2px; height:5px;
  background:rgba(255,255,255,0.85);
  border-radius:0 1px 1px 0;
}
.battery-body .fill {
  position:absolute; inset:1.5px; right:1.5px;
  background:rgba(255,255,255,0.85);
  border-radius:1px;
  width:70%;
}

/* ── Content ── */
.content {
  flex:1;
  overflow-y:auto;
  padding:0 20px 20px;
  position:relative;
}

/* Shimmer sweep */
.content::before {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:10;
  background:linear-gradient(105deg,
    transparent 40%,
    rgba(255,255,255,0.12) 45%,
    rgba(255,255,255,0.22) 50%,
    rgba(255,255,255,0.12) 55%,
    transparent 60%
  );
  background-size:250% 100%;
  animation:shimmer 6s ease-in-out infinite;
  border-radius:inherit;
}
@keyframes shimmer {
  0%,100% { background-position:200% 0; }
  50%     { background-position:-100% 0; }
}

/* ── Hero ── */
.hero {
  padding:32px 0 8px;
  text-align:center;
}
.hero-title {
  font-family:var(--serif);
  font-weight:900;
  font-size:38px;
  letter-spacing:0.15em;
  color:#fff;
  text-shadow:0 2px 16px rgba(102,80,164,0.5);
  padding-left:0.15em;
}
.hero-sub {
  margin-top:8px;
  font-family:var(--serif);
  font-size:14px;
  color:rgba(255,255,255,0.6);
  letter-spacing:0.06em;
}

/* ── Glass card base ── */
.glass {
  background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.22);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.12),
    inset 0 1px 0 rgba(255,255,255,0.3);
}
@supports not (backdrop-filter:blur(1px)) {
  .glass { background:rgba(255,255,255,0.18); }
}

/* ── Scan CTA — floating glass orb ── */
.scan-cta {
  margin-top:24px;
  border-radius:24px;
  padding:28px 24px;
  display:flex;
  align-items:center;
  gap:18px;
  cursor:pointer;
  transition:transform 0.15s ease;
  animation:glowPulse 4s ease-in-out infinite;
  position:relative;
  background:linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
  border:1px solid rgba(255,255,255,0.28);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.15),
    0 0 0 1px rgba(255,255,255,0.08),
    inset 0 1px 0 rgba(255,255,255,0.35);
}
@keyframes glowPulse {
  0%,100% {
    box-shadow:
      0 8px 32px rgba(0,0,0,0.15),
      0 0 0 1px rgba(255,255,255,0.08),
      inset 0 1px 0 rgba(255,255,255,0.35);
  }
  50% {
    box-shadow:
      0 8px 32px rgba(0,0,0,0.15),
      0 0 24px rgba(102,80,164,0.3),
      0 0 0 1px rgba(255,255,255,0.12),
      inset 0 1px 0 rgba(255,255,255,0.35);
  }
}
.scan-cta:active { transform:scale(0.97); }
.scan-cta .icon-wrap {
  width:52px; height:52px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:16px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.scan-cta .icon-wrap svg { width:28px; height:28px; color:#fff; }
.scan-cta .text {
  font-family:var(--serif);
  font-weight:700;
  font-size:22px;
  color:#fff;
  letter-spacing:0.04em;
}
.scan-cta .text small {
  display:block;
  font-weight:400;
  font-size:13px;
  color:rgba(255,255,255,0.55);
  margin-top:3px;
}
.scan-cta .arrow {
  margin-left:auto;
  color:rgba(255,255,255,0.5);
  font-size:20px;
}

/* ── Section header ── */
.section-header {
  display:flex;
  align-items:center;
  gap:10px;
  margin:28px 0 14px;
  font-family:var(--sans);
  font-weight:600;
  font-size:14px;
  color:rgba(255,255,255,0.55);
  letter-spacing:0.08em;
}

/* ── Frosted file cards ── */
.file-card {
  border-radius:18px;
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:10px;
  cursor:pointer;
  transition:transform 0.15s ease, background 0.2s ease;
  background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:
    0 4px 16px rgba(0,0,0,0.10),
    inset 0 1px 0 rgba(255,255,255,0.25);
  opacity:0;
  animation:fadeInUp 0.5s ease forwards;
}
@supports not (backdrop-filter:blur(1px)) {
  .file-card { background:rgba(255,255,255,0.16); }
}
.file-card:nth-child(1) { animation-delay:0.15s; }
.file-card:nth-child(2) { animation-delay:0.25s; }
.file-card:nth-child(3) { animation-delay:0.35s; }
.file-card:nth-child(4) { animation-delay:0.45s; }

@keyframes fadeInUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}

.file-card:hover { background:rgba(255,255,255,0.16); }
.file-card:active { transform:scale(0.98); }

.file-card .icon-area {
  width:44px; height:44px;
  background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.file-card .icon-area svg { width:22px; height:22px; color:rgba(255,255,255,0.7); }
.file-card .info { flex:1; min-width:0; }
.file-card .name {
  font-size:15px; font-weight:500; color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.file-card .time {
  font-size:13px; color:rgba(255,255,255,0.5);
  margin-top:2px;
}

/* ── Bottom nav ── */
.bottom-nav {
  height:83px;
  padding-bottom:23px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.12);
}
.nav-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:500;
  color:rgba(255,255,255,0.45);
  cursor:pointer;
  transition:color 0.2s;
  position:relative;
}
.nav-item.active { color:#fff; }
.nav-item.active::after {
  content:"";
  position:absolute;
  bottom:-6px;
  width:4px; height:4px;
  background:#fff;
  border-radius:50%;
}
.nav-item svg { width:24px; height:24px; }
</style>
</head>
<body>

  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
